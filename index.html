<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планировщик задач</title>
<style>
  :root {
    --bg: #edf0f3; --surface: #ffffff; --ink: #19222d; --muted: #657080;
    --line: #d5dbe2; --accent: #2557d6; --done: #1f8a5b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  h1 { font-size: 1.5rem; margin: 0; text-transform: capitalize; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .nav button { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
                border-radius: 8px; padding: 6px 12px; }
  .nav button:hover { border-color: var(--accent); }

  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 24px; }
  .day { border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
         padding: 8px 0; text-align: center; color: var(--ink); }
  .day small { display: block; color: var(--muted); }
  .day b { display: block; font-size: 1.15rem; }
  .day .count { display: block; min-height: 1.2em; font-size: .8rem; color: var(--accent); }
  .day.today b { text-decoration: underline; text-underline-offset: 4px; }
  .day.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .day.selected small, .day.selected .count { color: #dfe7ff; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 16px 16px; }
  .panel h2 { font-size: 1.15rem; margin: 12px 0 2px; text-transform: capitalize; }
  .progress { color: var(--muted); margin: 0 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  li label { flex: 1; cursor: pointer; overflow-wrap: anywhere; }
  li input { width: 20px; height: 20px; accent-color: var(--done); cursor: pointer; }
  li.done label { color: var(--muted); text-decoration: line-through; }
  .del { border: 0; background: none; color: var(--muted); font-size: 1.2rem; padding: 4px 8px; border-radius: 6px; }
  .del:hover { color: #b3261e; background: #fbeceb; }
  .empty { color: var(--muted); padding: 16px 0 8px; }

  form { display: flex; gap: 8px; margin-top: 12px; }
  form input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  form button { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 10px 16px; font-weight: 600; }
  #msg { color: #b3261e; min-height: 1.5em; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="month"></h1>
    <div class="nav">
      <button id="prev" aria-label="Предыдущая неделя">‹ Неделя</button>
      <button id="today">Сегодня</button>
      <button id="next" aria-label="Следующая неделя">Неделя ›</button>
    </div>
  </header>

  <div class="week" id="week"></div>

  <section class="panel">
    <h2 id="dayTitle"></h2>
    <p class="progress" id="progress"></p>
    <ul id="list"></ul>
    <form id="form">
      <input id="title" placeholder="Новая задача" autocomplete="off" maxlength="200" required>
      <button type="submit">Добавить</button>
    </form>
    <p id="msg" role="alert"></p>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

let selected = iso(new Date());
let tasks = [];

function weekStart(s) {
  const d = parse(s);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);   // Monday
  return d;
}
function shift(days) {
  const d = parse(selected);
  d.setDate(d.getDate() + days);
  selected = iso(d);
  load();
}

async function api(url, options) {
  try {
    const r = await fetch(url, options);
    if (!r.ok) throw new Error(r.status);
    $('#msg').textContent = '';
    return await r.json();
  } catch (e) {
    $('#msg').textContent = 'Не удалось связаться с сервером. Проверьте, что программа запущена.';
    throw e;
  }
}

async function load() {
  const start = weekStart(selected);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  tasks = await api(`/api/tasks?from=${iso(start)}&to=${iso(end)}`);
  render(start);
}

function render(start) {
  const todayIso = iso(new Date());
  $('#month').textContent = parse(selected).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

  $('#week').innerHTML = DAYS.map((name, i) => {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const key = iso(d);
    const open = tasks.filter(t => t.date === key && !t.done).length;
    const cls = ['day', key === selected ? 'selected' : '', key === todayIso ? 'today' : ''].join(' ');
    return `<button class="${cls}" data-date="${key}"><small>${name}</small><b>${d.getDate()}</b>` +
           `<span class="count">${open ? open + ' ост.' : ''}</span></button>`;
  }).join('');

  const dayTasks = tasks.filter(t => t.date === selected);
  const doneCount = dayTasks.filter(t => t.done).length;
  $('#dayTitle').textContent = parse(selected).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#progress').textContent = dayTasks.length ? `Выполнено ${doneCount} из ${dayTasks.length}` : '';
  $('#list').innerHTML = dayTasks.length
    ? dayTasks.map(t => `<li class="${t.done ? 'done' : ''}">` +
        `<input type="checkbox" id="t${t.id}" data-id="${t.id}" ${t.done ? 'checked' : ''}>` +
        `<label for="t${t.id}">${esc(t.title)}</label>` +
        `<button class="del" data-del="${t.id}" aria-label="Удалить задачу">×</button></li>`).join('')
    : '<li class="empty">На этот день задач нет. Добавьте первую.</li>';
}

$('#week').addEventListener('click', e => {
  const b = e.target.closest('.day');
  if (b) { selected = b.dataset.date; load(); }
});
$('#list').addEventListener('change', async e => {
  if (!e.target.dataset.id) return;
  await api(`/api/tasks/${e.target.dataset.id}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: e.target.checked })
  });
  load();
});
$('#list').addEventListener('click', async e => {
  const id = e.target.dataset.del;
  if (!id) return;
  await api(`/api/tasks/${id}`, { method: 'DELETE' });
  load();
});
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('#title').value.trim();
  if (!title) return;
  await api('/api/tasks', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, date: selected })
  });
  $('#title').value = '';
  load();
});
$('#prev').onclick = () => shift(-7);
$('#next').onclick = () => shift(7);
$('#today').onclick = () => { selected = iso(new Date()); load(); };

load();
</script>
</body>
</html>
